name: frame

# Single-box deployment: Postgres + API + web + admin, all on one EC2 host.
# Image refs (IMAGE_*) are injected by the Deploy workflow; everything else
# comes from ~/frame/.env.prod (see deploy/.env.prod.example).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes compose interpolation — evaluated inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE_API:-ghcr.io/OWNER/REPO-api:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: "4000"
      # Public origins used to build absolute links (uploads / invites / verify / billing).
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PUBLIC_TENANT_URL: ${PUBLIC_TENANT_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # --- Optional integrations (features degrade gracefully when unset) ---
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      MEILI_HOST: ${MEILI_HOST:-}
      MEILI_KEY: ${MEILI_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      DOMAIN_CNAME_TARGET: ${DOMAIN_CNAME_TARGET:-}
    # Apply migrations on every boot (idempotent), then start the server.
    command: ["sh", "-c", "pnpm --filter api exec prisma migrate deploy && node apps/api/dist/main.js"]
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  web:
    image: ${IMAGE_WEB:-ghcr.io/OWNER/REPO-web:latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  admin:
    image: ${IMAGE_ADMIN:-ghcr.io/OWNER/REPO-admin:latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3002:3002"

volumes:
  pgdata:
  uploads:
