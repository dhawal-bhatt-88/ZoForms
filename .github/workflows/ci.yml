name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · test · build
    runs-on: ubuntu-latest
    # prisma validate / generate resolve env("DATABASE_URL") at parse time.
    # No DB is contacted during CI — this is just a placeholder to satisfy it.
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/db?schema=public"
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter api exec prisma validate

      # Every colour pair the web app composes, in light and dark, measured from
      # globals.css (apps/web/scripts/contrast.mjs). Also fails if the committed
      # contrast.json is out of date. Needs no server.
      - name: Contrast gate
        run: pnpm --filter web contrast:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build all apps
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The e2e dev server resolves @formbuilder/form-schema from its build output.
      - name: Build workspace packages
        run: pnpm --filter @formbuilder/form-schema build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter web test:e2e
